# ---------------------------------------------------------------------------
# Memory settings tuned for THIS machine: 7.7 GB total RAM, 2 physical cores.
#
# The Flutter template ships `-Xmx8G -XX:MaxMetaspaceSize=4G`, which asks for
# 12 GB on a 7.7 GB box. The JVM starts anyway and then dies partway through
# Kotlin compilation, surfacing as the very misleading
#   "Could not close incremental caches ... class-fq-name-to-source.tab"
# on plugin after plugin, which reads like cache corruption rather than OOM.
#
# If you later move this project to a machine with 16 GB+, raising Xmx back to
# 4-6G will make builds noticeably faster.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# The Kotlin compiler runs in its OWN daemon with its own heap. Left unset it
# inherits the Gradle value above and the two together exceed available RAM.
kotlin.daemon.jvmargs=-Xmx1024m

# 2 physical cores. Higher just multiplies concurrent compiler daemons, and
# each one costs memory we do not have.
org.gradle.workers.max=2
org.gradle.parallel=false

# Incremental Kotlin compilation is what actually corrupted here. It buys
# little on a clean CI-style build and is the known failure mode under memory
# pressure. Turn it back on once builds are reliably green if you want faster
# edit-rebuild cycles.
kotlin.incremental=false

# Keep the daemon alive between builds; re-forking a JVM per build is the
# slowest possible option on 2 cores.
org.gradle.daemon=true
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
